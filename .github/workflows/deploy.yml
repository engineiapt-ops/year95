name: Production deploy

on:
  workflow_dispatch:
    inputs:
      confirmed_sha:
        description: 'Full 40-character SHA of the current main commit you reviewed.'
        required: true
        type: string
      confirm_production:
        description: 'Type exactly: publish-production'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: year95-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    name: Validate reviewed production release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      CONFIRMED_SHA: ${{ inputs.confirmed_sha }}
      CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
      PRODUCTION_WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
      PRODUCTION_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
      PRODUCTION_SUPABASE_ANON_KEY: ${{ vars.PRODUCTION_SUPABASE_ANON_KEY }}
      PRODUCTION_AUTH_TEST_EMAIL: ${{ vars.PRODUCTION_AUTH_TEST_EMAIL }}
      PRODUCTION_AUTH_TEST_PASSWORD: ${{ secrets.PRODUCTION_AUTH_TEST_PASSWORD }}
      CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Mask production secrets before any other step
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$PRODUCTION_AUTH_TEST_PASSWORD"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$RENDER_API_KEY"

      - name: Checkout the workflow-dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Gate 1 — require explicit production confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONFIRM_PRODUCTION" != "publish-production" ]]; then
            echo "::error::Type exactly publish-production to confirm a production release."
            exit 1
          fi

      - name: Gate 2 — require confirmed SHA to match current main
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CONFIRMED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::confirmed_sha must be the full 40-character lowercase hexadecimal SHA."
            exit 1
          fi
          if [[ "$CONFIRMED_SHA" != "$WORKFLOW_SHA" ]]; then
            echo "::error::confirmed_sha does not match the workflow_dispatch commit."
            exit 1
          fi
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ -z "$current_main" ]]; then
            echo "::error::Could not resolve current main; failing closed."
            exit 1
          fi
          if [[ "$CONFIRMED_SHA" != "$current_main" ]]; then
            echo "::error::confirmed_sha is not the current main HEAD. Review main and dispatch again."
            exit 1
          fi
          echo "Confirmed SHA matches workflow_dispatch and current main."

      - name: Gate 3 — require the latest CI run for ci.yml and this SHA to be successful
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/ci-workflow-runs.json"
          http_code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}'             --request GET "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$CONFIRMED_SHA&per_page=100"             --header "Authorization: Bearer $GH_TOKEN"             --header 'Accept: application/vnd.github+json'             --header 'X-GitHub-Api-Version: 2022-11-28')" || {
              echo "::error::Could not query CI workflow runs; production publication is blocked."
              exit 1
            }
          if [[ "$http_code" != "200" ]]; then
            echo "::error::CI workflow-runs API returned HTTP $http_code; production publication is blocked."
            exit 1
          fi
          if ! jq -e --arg sha "$CONFIRMED_SHA" '
            [.workflow_runs[] | select(.head_sha == $sha)] |
            sort_by(.created_at) |
            if length == 0 then false
            else (.[-1].status == "completed" and .[-1].conclusion == "success")
            end
          ' "$response" >/dev/null; then
            echo "::error::The latest run of .github/workflows/ci.yml for the confirmed SHA is not completed successfully."
            exit 1
          fi
          echo "Latest run of the exact ci.yml workflow for the confirmed SHA completed successfully."

      - name: Gate 4 — require all 11 production variables and secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            PRODUCTION_API_URL
            PRODUCTION_WEB_URL
            PRODUCTION_SUPABASE_URL
            PRODUCTION_SUPABASE_ANON_KEY
            PRODUCTION_AUTH_TEST_EMAIL
            PRODUCTION_AUTH_TEST_PASSWORD
            CLOUDFLARE_PAGES_PROJECT_NAME
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_API_TOKEN
            RENDER_SERVICE_ID
            RENDER_API_KEY
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required production environment variable or secret is missing: $name"
              exit 1
            fi
          done
          echo "::add-mask::$PRODUCTION_AUTH_TEST_PASSWORD"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$RENDER_API_KEY"
          echo "All required production configuration values are present; values withheld."

      - name: Gate 5 — validate exact production destinations and origins
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CLOUDFLARE_PAGES_PROJECT_NAME" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::CLOUDFLARE_PAGES_PROJECT_NAME must contain lowercase letters, numbers and hyphens only."
            exit 1
          fi
          node --input-type=module <<'NODE'
          const expected = {
            // Historical naming only: this existing Render service is the production API target.
            PRODUCTION_API_URL: 'https://year95-api-staging.onrender.com',
            PRODUCTION_SUPABASE_URL: 'https://dhvigrzfjipshubcbuaa.supabase.co',
            CLOUDFLARE_PAGES_PROJECT_NAME: 'year95-web',
            RENDER_SERVICE_ID: 'srv-db4il4ad0e5s73cg78g0',
            PRODUCTION_WEB_URL: 'https://year95-web.pages.dev',
          };
          for (const [name, exactValue] of Object.entries(expected)) {
            if (process.env[name] !== exactValue) {
              throw new Error(name + ' must exactly match the reviewed production endpoint; value withheld.');
            }
          }
          for (const name of ['PRODUCTION_API_URL', 'PRODUCTION_WEB_URL', 'PRODUCTION_SUPABASE_URL']) {
            let url;
            try {
              url = new URL(process.env[name]);
            } catch {
              throw new Error(name + ' must be a valid HTTPS origin; value withheld.');
            }
            if (url.protocol !== 'https:' || url.username || url.password || url.pathname !== '/' || url.search || url.hash) {
              throw new Error(name + ' must be an HTTPS origin without credentials, path, query or fragment.');
            }
          }
          const expectedWeb = 'https://' + process.env.CLOUDFLARE_PAGES_PROJECT_NAME + '.pages.dev';
          if (process.env.PRODUCTION_WEB_URL !== expectedWeb) {
            throw new Error('PRODUCTION_WEB_URL does not match the configured Cloudflare Pages project.');
          }
          if (!process.env.PRODUCTION_SUPABASE_ANON_KEY.trim()) {
            throw new Error('PRODUCTION_SUPABASE_ANON_KEY is empty.');
          }
          if (!/^[a-zA-Z0-9_-]+$/.test(process.env.CLOUDFLARE_ACCOUNT_ID)) {
            throw new Error('CLOUDFLARE_ACCOUNT_ID has an invalid format.');
          }
          if (!/^srv-[a-zA-Z0-9]+$/.test(process.env.RENDER_SERVICE_ID)) {
            throw new Error('RENDER_SERVICE_ID has an invalid format.');
          }
          console.log('Production endpoint and destination formats validated; sensitive values withheld.');
          NODE

      - name: Structural test — manual-only workflow and secret boundaries
        run: ruby scripts/test-production-deploy-workflow.rb
