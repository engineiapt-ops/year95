name: Temporary API shell formatting

on:
  push:
    branches:
      - feat/pr-007-api-shell

permissions:
  contents: write

jobs:
  format-api-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pr-007-api-shell
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.9"
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository Prettier configuration
        run: pnpm exec prettier apps/api/src/app.ts tests/unit/api-app.test.ts .github/workflows/api-docker.yml README.md --write

      - name: Commit formatting changes when needed
        run: |
          if git diff --quiet; then
            echo "Files already match Prettier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/app.ts tests/unit/api-app.test.ts .github/workflows/api-docker.yml README.md
          git commit -m "style(api): apply repository Prettier formatting"
          git push origin HEAD:feat/pr-007-api-shell
