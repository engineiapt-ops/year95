name: Temporary web lockfile refresh

on:
  push:
    branches: [feat/web-auth-dashboard]
    paths:
      - 'apps/web/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/_temporary-web-lockfile.yml'

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-auth-dashboard
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update pnpm lockfile from workspace manifests
        run: pnpm install --lockfile-only
      - name: Commit changed lockfile
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore(web): refresh workspace lockfile"
            git push origin feat/web-auth-dashboard
          fi
