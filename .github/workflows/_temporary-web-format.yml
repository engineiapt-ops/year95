name: Temporary web formatting

on:
  push:
    branches: [feat/web-auth-dashboard]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'packages/contracts/src/index.ts'
      - 'vitest.workspace.ts'
      - '.env.example'
      - '.github/workflows/ci.yml'
      - 'docs/BRANCH-PROTECTION.md'
      - 'docs/LOCAL-WEB-AUTH.md'
      - '.github/workflows/_temporary-web-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-auth-dashboard
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Format scoped files
        run: >-
          pnpm exec prettier --write
          apps/web package.json packages/contracts/src/index.ts
          vitest.workspace.ts .github/workflows/ci.yml
          docs/BRANCH-PROTECTION.md docs/LOCAL-WEB-AUTH.md
          .github/workflows/_temporary-web-format.yml
      - name: Commit formatting changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web package.json packages/contracts/src/index.ts vitest.workspace.ts .env.example .github/workflows/ci.yml docs/BRANCH-PROTECTION.md docs/LOCAL-WEB-AUTH.md .github/workflows/_temporary-web-format.yml
            git commit -m "style(web): format web shell and tests"
            git push origin feat/web-auth-dashboard
          fi
