name: Local Supabase Auth smoke test

on:
  pull_request:
    paths:
      - '.github/workflows/local-auth-smoke.yml'
      - 'scripts/local-auth-smoke.cjs'
      - 'docs/LOCAL-WEB-AUTH.md'
      - 'apps/api/**'
      - 'apps/web/**'
      - 'db/baseline/**'
      - 'db/migrations/**'
      - 'packages/**'
      - 'supabase/**'
      - 'tools/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/local-auth-smoke.yml'
      - 'scripts/local-auth-smoke.cjs'
      - 'docs/LOCAL-WEB-AUTH.md'
      - 'apps/api/**'
      - 'apps/web/**'
      - 'db/baseline/**'
      - 'db/migrations/**'
      - 'packages/**'
      - 'supabase/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-auth-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-local-auth:
    name: real-local-auth
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: supabase/setup-cli@v3
        with:
          version: 2.108.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client

      - name: Start disposable local Supabase
        shell: bash
        run: |
          set -euo pipefail
          if ! supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            echo "Supabase local stack failed to start. CLI output was kept off the job log to avoid printing local credentials."
            exit 1
          fi

      - name: Export only local API URL and public anon key
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a
          # This file is generated by the local CLI. Never print it: it contains a service-role key.
          source "$RUNNER_TEMP/supabase.env"
          set +a
          test -n "${API_URL:-}"
          test -n "${ANON_KEY:-}"
          test -n "${SERVICE_ROLE_KEY:-}"
          test -n "${DB_URL:-}"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          if [ -n "${JWT_SECRET:-}" ]; then echo "::add-mask::$JWT_SECRET"; fi
          {
            echo "SUPABASE_LOCAL_URL=$API_URL"
            echo "SUPABASE_LOCAL_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_LOCAL_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      - name: Bootstrap the disposable database and create an allowlisted local Auth user
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="$SUPABASE_LOCAL_DB_URL"
          DB_BASELINE_DISPOSABLE=1 DATABASE_URL="$DB_URL" pnpm db:baseline
          DATABASE_URL="$DB_URL" pnpm --filter @year95/persistence migrate

          SMOKE_EMAIL="year95-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          SMOKE_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$SMOKE_PASSWORD"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -v email="$SMOKE_EMAIL" <<'SQL'
          INSERT INTO public.allowed_emails(email)
          VALUES (lower(btrim(:'email')))
          ON CONFLICT (email) DO NOTHING;
          SQL

          set -a
          source "$RUNNER_TEMP/supabase.env"
          set +a
          echo "::add-mask::$SERVICE_ROLE_KEY"
          payload="$(jq -n --arg email "$SMOKE_EMAIL" --arg password "$SMOKE_PASSWORD" \
            '{email: $email, password: $password, email_confirm: true}')"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/create-user.json" \
            --write-out '%{http_code}' --request POST \
            "$SUPABASE_LOCAL_URL/auth/v1/admin/users" \
            --header "apikey: $SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data "$payload")"
          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "Could not create the ephemeral local Auth test user (HTTP $status). Response body was not printed."
            exit 1
          fi
          {
            echo "SMOKE_EMAIL=$SMOKE_EMAIL"
            echo "SMOKE_PASSWORD=$SMOKE_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Created one disposable allowlisted Auth user for this runner only."

      - name: Build the API
        run: pnpm --filter @year95/api build

      - name: Start API and web development servers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/year95-auth-smoke"
          NODE_ENV=development PORT=3000 \
            DATABASE_URL="$SUPABASE_LOCAL_DB_URL" \
            SUPABASE_URL="$SUPABASE_LOCAL_URL" \
            CORS_ORIGINS=http://127.0.0.1:5173 \
            pnpm --filter @year95/api start > "$RUNNER_TEMP/year95-auth-smoke/api.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/year95-auth-smoke/api.pid"

          VITE_API_BASE_URL=http://127.0.0.1:3000 \
            VITE_SUPABASE_URL="$SUPABASE_LOCAL_URL" \
            VITE_SUPABASE_ANON_KEY="$SUPABASE_LOCAL_ANON_KEY" \
            pnpm --filter @year95/web dev -- --host 127.0.0.1 --port 5173 \
            > "$RUNNER_TEMP/year95-auth-smoke/web.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/year95-auth-smoke/web.pid"

          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/health > /dev/null && \
               curl --silent --fail http://127.0.0.1:5173/login > /dev/null; then
              echo "API and web servers are responding."
              exit 0
            fi
            sleep 1
          done
          echo "API or web server did not become ready. Sanitized diagnostics:"
          grep -E 'Error|error|failed|Failed|listening|Local:' "$RUNNER_TEMP/year95-auth-smoke/api.log" "$RUNNER_TEMP/year95-auth-smoke/web.log" \
            | sed -E 's/(eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)/[REDACTED_JWT]/g' || true
          exit 1

      - name: Install isolated Playwright browser tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/year95-playwright" --no-save --package-lock=false playwright@1.55.0
          "$RUNNER_TEMP/year95-playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: Exercise real local sign-in, dashboard, logout and unauthorized-session handling
        env:
          PLAYWRIGHT_PACKAGE_DIR: ${{ runner.temp }}/year95-playwright/node_modules/playwright
          WEB_ORIGIN: http://127.0.0.1:5173
          API_ORIGIN: http://127.0.0.1:3000
          SUPABASE_LOCAL_URL: ${{ env.SUPABASE_LOCAL_URL }}
          SUPABASE_LOCAL_ANON_KEY: ${{ env.SUPABASE_LOCAL_ANON_KEY }}
          SMOKE_EMAIL: ${{ env.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ env.SMOKE_PASSWORD }}
        run: node scripts/local-auth-smoke.cjs
