name: API Docker

on:
  pull_request:
    paths:
      - apps/api/**
      - packages/config/**
      - packages/contracts/**
      - packages/persistence/**
      - packages/market-data/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .dockerignore
      - .github/workflows/api-docker.yml
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/config/**
      - packages/contracts/**
      - packages/persistence/**
      - packages/market-data/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .dockerignore
      - .github/workflows/api-docker.yml

permissions:
  contents: read

jobs:
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production API image
        run: docker build --file apps/api/Dockerfile --tag year95-api:${{ github.sha }} .

      - name: Verify API runtime workspace dependencies
        run: |
          docker run --rm --entrypoint node \
            "year95-api:${{ github.sha }}" \
            --input-type=module \
            -e "await import('./apps/api/dist/main.js'); console.log('API runtime workspace dependencies resolved.');"
