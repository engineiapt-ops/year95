services:
  - type: web
    name: year95-api-staging
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: 'off'
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_CERT_PEM
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: CORS_ORIGINS
        sync: false
